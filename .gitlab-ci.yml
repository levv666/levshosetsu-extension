image: eclipse-temurin:21-noble

stages:
  - validate
  - test
  - deploy

before_script:
  - apt update; apt install -y git
  - |
    if [ -z "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
      export FILES=($(git diff-tree --no-commit-id --name-only -r $CI_COMMIT_SHA | grep '^src/.*\.lua$'));
    else
      git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME;
      export FILES=($(git diff --name-only $CI_MERGE_REQUEST_TARGET_BRANCH_NAME...$CI_COMMIT_SHA | grep '^src/.*\.lua$'));
    fi

download:
  stage: .pre
  script:
    - ./dev-setup.sh --tester
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - bin
  rules:
    - when: always

index:
  stage: validate
  script:
    - java -jar bin/extension-tester.jar --ci --generate-index
    - DELTA=$(git diff --minimal -- index.json)
    - |
      if [ ! -z "$DELTA" ]; then
        echo "Index file is out of date. Auto-fixing..."
        git config user.email "ci-bot@example.com"
        git config user.name "CI Bot"
        git add index.json
        git commit -m "chore: auto-update index.json [skip ci]"
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_REF_NAME}
        echo "Successfully pushed updated index.json."
      else
        echo "Index is up to date."
      fi
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - bin
  rules:
    - when: always

metadata:
  stage: validate
  script:
    - 'if [ ! -z "$FILES" ]; then java -jar bin/extension-tester.jar --ci --validate-metadata "${FILES[@]}"; fi'
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - bin
  rules:
    - changes:
        - "src/**/*.lua"

test:
  stage: test
  script:
    - 'if [ ! -z "$FILES" ]; then java -jar bin/extension-tester.jar --ci "${FILES[@]}"; fi'
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - bin
  rules:
    - changes:
        - "src/**/*.lua"

pages:
  stage: deploy
  script:
    - mkdir public
    - cp -r src public/
    - cp -r lib public/
    - cp -r icons public/
    - cp index.json public/
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"